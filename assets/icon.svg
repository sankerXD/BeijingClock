  <text x="256" y="202" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="10" font-weight="600" fill="#ef4444" text-anchor="middle" letter-spacing="2">UTC +8</text>

  <!-- Subdial (Date / Timezone Accent) -->
