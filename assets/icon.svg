    <line x1="256" y1="256" x2="170" y2="390" stroke="url(#redGrad)" stroke-width="2" stroke-linecap="round" />
    <!-- Counterbalance Tail -->
    <line x1="256" y1="256" x2="282" y2="214" stroke="url(#redGrad)" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="282" cy="214" r="4" fill="#ef4444" />
  </g>

