  <!-- Hour Hand (pointing at ~10:10) -->
  <g filter="url(#handShadow)">
    <line x1="256" y1="256" x2="178" y2="158" stroke="url(#handGrad)" stroke-width="7" stroke-linecap="round" />
    <line x1="256" y1="256" x2="178" y2="158" stroke="#0f172a" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Minute Hand (pointing at ~2:08 / 50 deg) -->
