<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2330" />
      <stop offset="50%" stop-color="#11141c" />
      <stop offset="100%" stop-color="#080a0e" />
    </linearGradient>

    <!-- Bezel Outer Gradient -->
    <linearGradient id="bezelOuter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <!-- Dial Radial Gradient -->
    <radialGradient id="dialGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#1e222d" />
      <stop offset="70%" stop-color="#0f1117" />
      <stop offset="100%" stop-color="#07080b" />
    </radialGradient>

    <!-- Metallic Hand Gradient -->
    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#94a3b8" />
    </linearGradient>

    <!-- Red Hand Gradient -->
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff4d4f" />
      <stop offset="100%" stop-color="#cf1322" />
    </linearGradient>

    <!-- Shadow Filter -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
    <filter id="handShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- App Icon Base (Apple macOS Squircle) -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" filter="url(#dropShadow)" />

  <!-- Outer Bezel Ring -->
  <circle cx="256" cy="256" r="205" fill="none" stroke="url(#bezelOuter)" stroke-width="6" />
  <circle cx="256" cy="256" r="200" fill="url(#dialGrad)" stroke="#1e293b" stroke-width="2" />

