name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号 (例如 v1.1.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build BeijingClock App
        run: |
          chmod +x build.sh
          bash build.sh

      - name: Package App Bundle
        run: |
          ditto -c -k --sequesterRsrc --keepParent BeijingClock.app BeijingClock-macOS.zip
          shasum -a 256 BeijingClock-macOS.zip > BeijingClock-macOS.zip.sha256

      - name: Determine Release Tag
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version }}"
            [ -z "$TAG" ] && TAG="v1.0.0"
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag }}
          name: BeijingClock ${{ steps.vars.outputs.tag }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            BeijingClock-macOS.zip
            BeijingClock-macOS.zip.sha256
